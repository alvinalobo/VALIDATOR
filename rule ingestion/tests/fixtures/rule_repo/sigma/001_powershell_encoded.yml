title: Suspicious PowerShell Encoded Command Execution
id: 11111111-1111-1111-1111-111111111111
status: stable
description: Detects PowerShell invoked with an encoded command, a common defence evasion technique.
author: Pod Alpha
date: 2026/09/16
tags:
    - attack.execution
    - attack.defense_evasion
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains:
            - '-enc '
            - '-EncodedCommand'
    condition: selection
falsepositives:
    - Legitimate administrative scripting
level: high
