title: Persistence via Scheduled Task Creation
id: 33333333-3333-3333-3333-333333333333
status: stable
description: Detects creation of a scheduled task used for persistence.
author: Pod Alpha
date: 2026/09/16
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    condition: selection
falsepositives:
    - Software installation routines
    - Patch management
level: medium
