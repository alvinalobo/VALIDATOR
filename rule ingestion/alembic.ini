# Alembic configuration for the Rule Ingestion Service.
#
# The Week 2 deliverable requires Alembic migrations for the `detection_rules`
# table. The revision script itself already existed at
# `app/models/database.py`, but without this file and the `alembic/` scaffold
# there was no way to actually execute it.
#
# The database URL is intentionally left blank here: `alembic/env.py` resolves
# it from the DATABASE_URL environment variable at runtime and falls back to a
# local SQLite file, so no credentials are ever committed.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os

# Timestamped revision filenames, e.g. 2026_09_16_1200_add_column.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url is set programmatically in alembic/env.py from DATABASE_URL.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
