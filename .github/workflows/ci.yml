name: Python CI

# NOTE: GitHub Actions only reads workflows from the repository ROOT
# (.github/workflows/), not from subdirectories — the previous copy
# under `rule ingestion/.github/workflows/` never ran.

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install Dependencies
      working-directory: rule ingestion
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      working-directory: rule ingestion
      run: |
        pytest

    - name: Build Docker Image
      working-directory: rule ingestion
      run: docker build -f dockerfile -t rule-ingestion .